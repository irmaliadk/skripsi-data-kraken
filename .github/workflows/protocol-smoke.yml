name: Periksa kode rancangan Bab 4

on:
  push:
    paths:
      - scripts/thesis_protocol.py
      - scripts/tune_detectors.py
      - scripts/final_test.py
      - .github/workflows/protocol-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Periksa sintaks dan satu contoh validasi
        run: |
          python -m py_compile scripts/thesis_protocol.py scripts/tune_detectors.py scripts/final_test.py
          python scripts/tune_detectors.py --smoke
      - name: Simpan laporan uji kecil
        uses: actions/upload-artifact@v4
        with:
          name: thesis-protocol-smoke
          path: |
            reports/smoke_validation_runs.csv
            reports/smoke_validation_summary.csv
            reports/smoke_injection_audit.csv

