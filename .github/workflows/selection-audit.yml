name: Audit pemilihan konfigurasi detektor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/selection-audit.yml"
      - "scripts/selection_audit.py"

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Hitung ulang detektor dan periksa aliran asli
        run: python scripts/selection_audit.py
      - name: Tampilkan keputusan dan batasnya
        if: success()
        run: cat reports/selection_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Simpan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-audit
          path: reports/selection_audit.md
          if-no-files-found: warn

