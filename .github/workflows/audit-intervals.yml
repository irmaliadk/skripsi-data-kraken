name: Periksa kelayakan interval 1 dan 5 menit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-intervals.yml"
      - "scripts/audit_interval_feasibility.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/audit_interval_feasibility.py
      - uses: actions/upload-artifact@v4
        with:
          name: kelayakan-interval
          path: reports/interval_feasibility.md


