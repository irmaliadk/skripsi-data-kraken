name: Validasi konfigurasi KSWIN dan PCA-CD

# Tidak dijalankan saat data atau kode berubah; validasi penuh dimulai manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Jalankan 50 titik validasi per jenis perubahan
        run: python scripts/tune_detectors.py
      - name: Simpan hasil validasi
        uses: actions/upload-artifact@v4
        with:
          name: thesis-detector-validation
          path: |
            reports/thesis_validation_runs.csv
            reports/thesis_validation_summary.csv
            reports/thesis_injection_audit.csv
            reports/thesis_selected_config.json

