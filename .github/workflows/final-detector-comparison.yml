name: Perbandingan akhir KSWIN dan PCA-CD

# Pengujian akhir dimulai manual setelah validasi dan persetujuan pelaksanaan.
on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: "Nomor run Validasi konfigurasi yang menghasilkan pilihan final"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  final-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ambil konfigurasi terpilih dari run validasi
        uses: actions/download-artifact@v4
        with:
          name: thesis-detector-validation
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ github.token }}
          path: reports
      - name: Jalankan pengujian akhir
        env:
          TEST_CUTOFF_UTC: '2026-11-11 16:45:00+00:00'
        run: |
          python scripts/final_test.py \
            --test-cutoff "$TEST_CUTOFF_UTC" \
            --selection reports/thesis_selected_config.json \
            --confirm-final
      - name: Simpan keluaran pengujian dan konfigurasi sumber
        uses: actions/upload-artifact@v4
        with:
          name: thesis-detector-comparison
          path: |
            reports/thesis_validation_runs.csv
            reports/thesis_validation_summary.csv
            reports/thesis_injection_audit.csv
            reports/thesis_selected_config.json
            reports/thesis_final_runs.csv
            reports/thesis_final_summary.csv
            reports/thesis_final_injection_audit.csv
            reports/thesis_final_timestamps.csv
            reports/thesis_final_metadata.json

